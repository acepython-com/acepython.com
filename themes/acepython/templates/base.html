<!DOCTYPE html>
<html lang="en" data-theme="emerald">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ SITENAME }}{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ SITEURL }}/theme/acepython.png">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Typography styles for article prose */
        .prose { color: inherit; line-height: 1.75; }
        .prose h2 { font-size: 1.5em; font-weight: 700; margin-top: 2em; margin-bottom: 1em; line-height: 1.33; }
        .prose h3 { font-size: 1.25em; font-weight: 600; margin-top: 1.6em; margin-bottom: 0.6em; line-height: 1.6; }
        .prose p { margin-top: 1.25em; margin-bottom: 1.25em; }
        .prose a { color: #2563eb; text-decoration: underline; }
        .prose a:hover { color: #1d4ed8; }
        .prose strong { font-weight: 700; }
        .prose code { background-color: #f3f4f6; padding: 0.2em 0.4em; border-radius: 0.25rem; font-size: 0.875em; }
        .prose pre { background-color: #1e293b; color: #e2e8f0; padding: 1em 1.5em; border-radius: 0.5rem; overflow-x: auto; margin-top: 1.5em; margin-bottom: 1.5em; }
        .prose pre code { background-color: transparent; padding: 0; border-radius: 0; font-size: 0.875em; color: inherit; }
        .prose ul { list-style-type: disc; padding-left: 1.625em; margin-top: 1.25em; margin-bottom: 1.25em; }
        .prose ol { list-style-type: decimal; padding-left: 1.625em; margin-top: 1.25em; margin-bottom: 1.25em; }
        .prose li { margin-top: 0.5em; margin-bottom: 0.5em; }
        .prose blockquote { border-left: 4px solid #d1d5db; padding-left: 1em; font-style: italic; margin-top: 1.6em; margin-bottom: 1.6em; }
        .prose img { margin-top: 2em; margin-bottom: 2em; border-radius: 0.5rem; }
        .prose hr { border-color: #e5e7eb; margin-top: 3em; margin-bottom: 3em; }
        /* Override highlight background for code blocks */
        .prose .highlight { background: #1e293b; border-radius: 0.5rem; padding: 1em 1.5em; overflow-x: auto; margin-top: 1.5em; margin-bottom: 1.5em; }
        .prose .highlight pre { background: transparent; padding: 0; margin: 0; }
    </style>
    <script src="https://unpkg.com/htmx.org@2"></script>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="19229676-7247-4ebf-9293-b3436ae96c22"></script>
    <link rel="stylesheet" href="{{ SITEURL }}/theme/css/pygments.css">
    {% if FEED_ALL_ATOM %}
    <link rel="alternate" type="application/atom+xml" title="{{ SITENAME }} Feed" href="{{ SITEURL }}/{{ FEED_ALL_ATOM }}">
    {% endif %}
</head>
<body>
    {% include "navbar.html" %}
    {% block content %}{% endblock %}
</body>
</html>
